<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f8faf7"/>
  <rect width="1080" height="154" fill="#163b2f"/>
  <text x="64" y="60" font-family="Malgun Gothic, Arial, sans-serif" font-size="34" font-weight="700" fill="#eaf5ef">EMINAI DAILY REPORT</text>
  <text x="64" y="112" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#bdd8ca">2026-07-29 · 18:00 KST</text>
  <text x="825" y="88" font-family="Malgun Gothic, Arial, sans-serif" font-size="25" font-weight="700" fill="#eaf5ef">수집 37 · 분석 12</text>

  <rect x="64" y="194" width="952" height="256" rx="26" fill="#ffffff" stroke="#d6e2dc" stroke-width="2"/>
  <text x="104" y="254" font-family="Malgun Gothic, Arial, sans-serif" font-size="38" font-weight="700" fill="#163b2f">오늘 한눈에</text>
  <text x="104" y="320" font-family="Malgun Gothic, Arial, sans-serif" font-size="32" font-weight="700" fill="#1b1f1d">미-이란 긴장과 협상 신호가 동시에 나오며</text>
  <text x="104" y="365" font-family="Malgun Gothic, Arial, sans-serif" font-size="32" font-weight="700" fill="#1b1f1d">시장은 유가 급락과 기술주 조정으로 반응했다.</text>
  <text x="104" y="415" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#5d7068">최고 위험: 높음 · 주요 축: 미국 기술주, 원유, 중동 리스크</text>

  <text x="64" y="530" font-family="Malgun Gothic, Arial, sans-serif" font-size="36" font-weight="700" fill="#163b2f">오늘 있었던 일</text>

  <rect x="64" y="572" width="952" height="186" rx="22" fill="#ffffff" stroke="#d6e2dc" stroke-width="2"/>
  <circle cx="118" cy="632" r="24" fill="#2f7d62"/>
  <text x="111" y="642" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1</text>
  <text x="164" y="620" font-family="Malgun Gothic, Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">미-이란 발언 충돌</text>
  <text x="164" y="668" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">트럼프는 이란 핵시설 타격 가능성을 경고했고, 이란은 미국과의</text>
  <text x="164" y="704" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">협상 요청을 부인했다. 협상 기대와 군사 리스크가 동시에 남았다.</text>

  <rect x="64" y="784" width="952" height="186" rx="22" fill="#ffffff" stroke="#d6e2dc" stroke-width="2"/>
  <circle cx="118" cy="844" r="24" fill="#2f7d62"/>
  <text x="111" y="854" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2</text>
  <text x="164" y="832" font-family="Malgun Gothic, Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">유가 급락</text>
  <text x="164" y="880" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">중동 긴장 완화 기대가 일부 반영되며 국제유가가 하락했다.</text>
  <text x="164" y="916" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">다만 군사행동 경고가 유지돼 리스크 프리미엄은 완전히 사라지지 않았다.</text>

  <rect x="64" y="996" width="952" height="186" rx="22" fill="#ffffff" stroke="#d6e2dc" stroke-width="2"/>
  <circle cx="118" cy="1056" r="24" fill="#2f7d62"/>
  <text x="111" y="1066" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">3</text>
  <text x="164" y="1044" font-family="Malgun Gothic, Arial, sans-serif" font-size="30" font-weight="700" fill="#18211d">나스닥 조정과 순환매</text>
  <text x="164" y="1092" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">기술주 차익실현이 이어지며 나스닥100이 조정 구간에 들어섰다.</text>
  <text x="164" y="1128" font-family="Malgun Gothic, Arial, sans-serif" font-size="24" fill="#47564f">자금은 경기방어주와 가치주로 이동하는 흐름을 보였다.</text>

  <rect x="64" y="1210" width="952" height="92" rx="22" fill="#eaf4ef" stroke="#bdd8ca" stroke-width="2"/>
  <text x="104" y="1254" font-family="Malgun Gothic, Arial, sans-serif" font-size="28" font-weight="700" fill="#163b2f">내일 볼 것</text>
  <text x="286" y="1254" font-family="Malgun Gothic, Arial, sans-serif" font-size="23" fill="#36453f">유가 반등 여부 · 기술주 매도 확산 · 미-이란 실제 협상 신호</text>
</svg>
